databases:
  - name: rootsphere-db
    plan: free
    databaseName: smartsoil
    user: user
    region: singapore

services:
  - type: web
    name: rootsphere-api
    plan: free
    region: singapore
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rootsphere-db
          property: connectionURI
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /health
